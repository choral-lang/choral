# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  formatting:
    name: Spotless
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # We need a full git history so Spotless can diff against origin/master
        fetch-depth: 0
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Check formatting
      run: mvn --batch-mode --no-transfer-progress spotless:check --file pom.xml

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        java: [ '17', '21', '23', '25' ]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven
    - name: Build and test with Maven
      run: mvn --batch-mode --no-transfer-progress verify --file pom.xml
    - name: Smoke test the Choral launcher
      run: java -jar dist/target/choral-standalone.jar check tests/src/main/choral/MustPass/Misc/HelloRoles.ch
