# This workflow will build a package using Maven and then publish it to
# Maven Central when a GitHub Release is published

name: Maven Package

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Validate release version
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$TAG_NAME' must match v#.#.#" >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          PROJECT_VERSION="$(mvn --batch-mode --quiet --non-recursive help:evaluate -Dexpression=project.version -DforceStdout -Dstyle.color=never)"
          if [[ "$PROJECT_VERSION" != "$VERSION" ]]; then
            echo "Release tag version '$VERSION' does not match Maven project version '$PROJECT_VERSION'" >&2
            exit 1
          fi

          echo "choralVersion=$VERSION" >> "$GITHUB_ENV"

      - name: Build with Maven
        run: mvn --batch-mode package

      - name: Unit Tests
        run: mvn --batch-mode test

      - name: Prepare Artifact
        run: unzip "dist/target/choral-${{env.choralVersion}}" -d "dist/target/choral-${{env.choralVersion}}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: choral-${{env.choralVersion}}
          path: dist/target/choral-${{env.choralVersion}}/*

      - name: Publish package
        run: mvn -P release --batch-mode deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
