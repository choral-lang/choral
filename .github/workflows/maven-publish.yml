# This workflow will build a package using Maven and then publish it to
# Maven Central when a GitHub Release is published

name: Maven Package

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Validate release tag
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$TAG_NAME' must match v#.#.#" >&2
            exit 1
          fi

          echo "CHORAL_VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Build with Maven
        run: mvn --batch-mode -Drevision="$CHORAL_VERSION" package

      - name: Validate distribution
        run: unzip -t "dist/target/choral-$CHORAL_VERSION.zip"

      - name: Publish package
        run: mvn --batch-mode -Drevision="$CHORAL_VERSION" -P release deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}

      - name: Attach distribution to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "dist/target/choral-$CHORAL_VERSION.zip" --clobber
