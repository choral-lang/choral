name: Compatibility Tests
# This workflow builds a few projects with the latest version of Choral.
# It helps us make sure we're not breaking anything that downstream
# consumers rely on. Only add projects to this workflow if they're not
# under active development - otherwise, bugs in those projects will
# make this a workflow flaky.

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  irc:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ["21", "25"]

    steps:
      - name: Check out Choral
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"
          cache: maven

      - name: Install Choral
        run: mvn --batch-mode --no-transfer-progress install

      - name: Check out IRC
        uses: actions/checkout@v4
        with:
          repository: choral-lang/irc
          path: irc

      - name: Build and test IRC
        working-directory: irc
        run: mvn --batch-mode --no-transfer-progress verify -Dchoral.version=0.0.0-SNAPSHOT
